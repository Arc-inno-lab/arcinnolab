# Maintient le projet Supabase éveillé.
#
# POURQUOI : sur le plan Free, Supabase met un projet en pause après 7 jours
# sans aucune activité. ArcInnoLab a un usage volontairement irrégulier (le
# comité ne siège qu'une fois par an), donc la mise en pause n'est pas un
# risque hypothétique : sans ce workflow, elle arrive.
#
# CE QUE ÇA FAIT : une requête HTTP anodine vers l'API REST du projet, deux
# fois par semaine. Ça suffit à réarmer le compteur d'inactivité.
#
# LIMITE CONNUE : GitHub désactive automatiquement les workflows planifiés
# d'un dépôt resté inactif 60 jours. Une tâche de surveillance mensuelle
# vérifie que ce workflow tourne toujours (voir supabase/README.md).
#
# AUCUN SECRET À CRÉER : les identifiants utilisés ici sont l'adresse du projet
# et sa clé « anon », publiques par conception — elles partent déjà dans le
# navigateur de chaque visiteur, et ce sont les policies RLS qui protègent les
# données. Les inscrire en clair évite de dépendre d'une configuration que
# personne ne pense à refaire. Des secrets GitHub du même nom, s'ils existent,
# restent prioritaires.

name: Keep Supabase alive

on:
  schedule:
    # Lundi et jeudi à 6h12 UTC. Minute décalée volontairement : les crons
    # à pile l'heure sont les plus chargés chez GitHub et donc les plus
    # souvent retardés ou sautés.
    - cron: "12 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Réveiller la base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://poewilykmxwpxqvkrrjq.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvZXdpbHlrbXh3cHhxdmtycmpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNDU1NDcsImV4cCI6MjEwNDYyMTU0N30.LbAyZIGSoMA8UBajxpVsCeEYhDxtRA_0mDirqgAszLI' }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Adresse ou clé Supabase absente."
            exit 1
          fi

          # On interroge une fonction RPC publique et sans effet de bord.
          # Elle traverse toute la pile (PostgREST puis Postgres), ce qui
          # garantit que la base elle-même est sollicitée — un simple appel
          # à la racine de l'API ne réveillerait pas forcément Postgres.
          code=$(curl --silent --show-error --location \
            --output /tmp/reponse.json \
            --write-out "%{http_code}" \
            --max-time 45 --retry 3 --retry-delay 15 --retry-all-errors \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/admin_exists" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "HTTP ${code}"
          echo "Réponse : $(cat /tmp/reponse.json)"

          if [ "${code}" != "200" ]; then
            echo "::error::La base n'a pas répondu correctement (HTTP ${code})."
            echo "::error::Vérifier sur supabase.com si le projet a été mis en pause."
            exit 1
          fi

          echo "Base éveillée."
