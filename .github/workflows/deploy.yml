# Déploiement en production sur Vercel.
#
# POURQUOI CE DÉTOUR : le plan Vercel gratuit (Hobby) refuse de déployer depuis
# un dépôt appartenant à une organisation GitHub — il faut le plan Pro pour ça.
# Le code d'ArcInnoLab vit dans l'organisation `Arc.inno.lab` (c'est ce qui
# permet d'inviter les partenaires nominativement), donc l'intégration Git
# native de Vercel est inutilisable. On appelle la CLI Vercel à la place :
# elle, ne fait pas cette distinction.
#
# EFFET DE BORD BIENVENU : le jeton de déploiement vit dans les secrets GitHub,
# il n'a jamais besoin d'être partagé ni collé ailleurs.
#
# SECRETS À CRÉER (Settings > Secrets and variables > Actions) :
#   VERCEL_TOKEN       Vercel > Settings > Tokens
#   VERCEL_ORG_ID      figure dans .vercel/project.json après un `vercel link`
#   VERCEL_PROJECT_ID  idem

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Un seul déploiement à la fois : si deux push s'enchaînent, seul le dernier
  # compte et l'intermédiaire est annulé plutôt que de courir en parallèle.
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer la CLI Vercel
        run: npm install --global vercel@latest

      - name: Récupérer la configuration du projet
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Construire
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Déployer
        id: deploiement
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Déployé sur ${url}"

      - name: Vérifier que le déploiement sert vraiment l'application
        run: |
          set -euo pipefail
          url="${{ steps.deploiement.outputs.url }}"

          # Un déploiement partiel s'affiche « READY » côté Vercel tout en
          # servant une application cassée : c'est exactement ce qui est arrivé
          # en septembre 2026. La seule preuve qui compte est une requête réelle
          # sur une route profonde. /projets renvoie 404 quand l'arborescence
          # déployée est incomplète, alors que la page d'accueil paraît normale.
          echec=0
          verifier() {
            chemin="$1"; attendu="$2"
            code=$(curl -o /dev/null -s -w "%{http_code}" --max-time 30 "${url}${chemin}")
            if [ "${code}" = "${attendu}" ]; then
              echo "  OK      ${chemin} -> ${code}"
            else
              echo "::error::${chemin} a répondu ${code}, attendu ${attendu}"
              echec=1
            fi
          }

          verifier "/login"    "200"
          verifier "/a-propos" "200"
          verifier "/projets"  "307"

          if [ "${echec}" -ne 0 ]; then
            echo "::error::Déploiement incomplet — ne pas considérer la mise en production comme réussie."
            exit 1
          fi
          echo "Déploiement vérifié."
